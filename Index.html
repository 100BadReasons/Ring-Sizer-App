<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ring Size Finder</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    
    <style>
        /* Custom styles for iframe embedding */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        
        /* Print styles */
        @media print {
            .print\:block { display: block !important; }
            .print\:hidden { display: none !important; }
        }
        
        /* Ensure proper sizing in iframe */
        #root {
            min-height: 100vh;
            width: 100%;
        }
        
        /* Custom component styles to match shadcn/ui */
        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }
        
        .card-header {
            padding: 1.5rem 1.5rem 0 1.5rem;
        }
        
        .card-content {
            padding: 1.5rem;
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.75rem;
        }
        
        .card-description {
            font-size: 0.875rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }
        
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .button-primary {
            background-color: #3b82f6;
            color: white;
        }
        
        .button-primary:hover {
            background-color: #2563eb;
        }
        
        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .input {
            display: flex;
            height: 2.5rem;
            width: 100%;
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
            background-color: white;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
        }
        
        .input:focus {
            outline: none;
            ring: 2px;
            ring-color: #3b82f6;
            border-color: #3b82f6;
        }
        
        .select {
            display: flex;
            height: 2.5rem;
            width: 100%;
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
            background-color: white;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 9999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: #f3f4f6;
            color: #374151;
        }
        
        .alert {
            border-radius: 0.375rem;
            border: 1px solid;
            padding: 1rem;
        }
        
        .alert-info {
            background-color: #dbeafe;
            border-color: #93c5fd;
            color: #1e40af;
        }
        
        .tabs {
            width: 100%;
        }
        
        .tabs-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background-color: #f9fafb;
            border-radius: 0.375rem;
            padding: 0.25rem;
        }
        
        .tabs-trigger {
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tabs-trigger.active {
            background-color: white;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }
        
        .tabs-content {
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { Ruler, Download, Info, Calculator } = lucide;

        const ringSizes = [
            { size: 3, ukSize: "F", diameter: 14.1, circumference: 44.2 },
            { size: 3.5, ukSize: "F½", diameter: 14.5, circumference: 45.5 },
            { size: 4, ukSize: "G", diameter: 14.9, circumference: 46.8 },
            { size: 4.5, ukSize: "H", diameter: 15.3, circumference: 48.0 },
            { size: 5, ukSize: "I", diameter: 15.7, circumference: 49.3 },
            { size: 5.5, ukSize: "J", diameter: 16.1, circumference: 50.6 },
            { size: 6, ukSize: "K", diameter: 16.5, circumference: 51.9 },
            { size: 6.5, ukSize: "L", diameter: 16.9, circumference: 53.1 },
            { size: 7, ukSize: "M", diameter: 17.3, circumference: 54.4 },
            { size: 7.5, ukSize: "N", diameter: 17.7, circumference: 55.7 },
            { size: 8, ukSize: "O", diameter: 18.1, circumference: 57.0 },
            { size: 8.5, ukSize: "P", diameter: 18.5, circumference: 58.3 },
            { size: 9, ukSize: "Q", diameter: 18.9, circumference: 59.5 },
            { size: 9.5, ukSize: "R", diameter: 19.4, circumference: 60.8 },
            { size: 10, ukSize: "S", diameter: 19.8, circumference: 62.1 },
            { size: 10.5, ukSize: "T", diameter: 20.2, circumference: 63.4 },
            { size: 11, ukSize: "U", diameter: 20.6, circumference: 64.6 },
            { size: 11.5, ukSize: "V", diameter: 21.0, circumference: 65.9 },
            { size: 12, ukSize: "W", diameter: 21.4, circumference: 67.2 },
            { size: 12.5, ukSize: "X", diameter: 21.8, circumference: 68.5 },
            { size: 13, ukSize: "Y", diameter: 22.2, circumference: 69.7 },
        ];

        const convertToMm = (value, fromUnit) => {
            return fromUnit === "inches" ? value * 25.4 : value;
        };

        function RingSizerApp() {
            const [diameter, setDiameter] = useState("");
            const [circumference, setCircumference] = useState("");
            const [calculatedSize, setCalculatedSize] = useState(null);
            const [unit, setUnit] = useState("mm");
            const [activeTab, setActiveTab] = useState("measure");

            const findRingSize = (measurement, type) => {
                let closest = ringSizes[0];
                let minDiff = Math.abs(ringSizes[0][type] - measurement);

                for (const size of ringSizes) {
                    const diff = Math.abs(size[type] - measurement);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closest = size;
                    }
                }
                return closest.size;
            };

            const handleDiameterCalculation = () => {
                if (diameter) {
                    const diameterInMm = convertToMm(parseFloat(diameter), unit);
                    const size = findRingSize(diameterInMm, "diameter");
                    setCalculatedSize(size);
                }
            };

            const handleCircumferenceCalculation = () => {
                if (circumference) {
                    const circumferenceInMm = convertToMm(parseFloat(circumference), unit);
                    const size = findRingSize(circumferenceInMm, "circumference");
                    setCalculatedSize(size);
                }
            };

            const printRingSizer = () => {
                window.print();
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 to-pink-50 p-4">
                    <div className="max-w-4xl mx-auto space-y-6">
                        <div className="text-center space-y-2">
                            <h1 className="text-4xl font-bold text-gray-900">Ring Size Finder</h1>
                            <p className="text-lg text-gray-600">Find your perfect ring size with our easy-to-use tools</p>
                        </div>

                        <div className="tabs">
                            <div className="tabs-list">
                                <button 
                                    className={`tabs-trigger ${activeTab === 'measure' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('measure')}
                                >
                                    Measure Ring
                                </button>
                                <button 
                                    className={`tabs-trigger ${activeTab === 'finger' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('finger')}
                                >
                                    Measure Finger
                                </button>
                                <button 
                                    className={`tabs-trigger ${activeTab === 'chart' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('chart')}
                                >
                                    Size Chart
                                </button>
                            </div>

                            {activeTab === 'measure' && (
                                <div className="tabs-content space-y-6">
                                    <div className="card">
                                        <div className="card-header">
                                            <h2 className="card-title flex items-center gap-2">
                                                <Ruler className="h-5 w-5" />
                                                Measure an Existing Ring
                                            </h2>
                                            <p className="card-description">Measure the inner diameter of a ring that fits well</p>
                                        </div>
                                        <div className="card-content space-y-4">
                                            <div className="alert alert-info">
                                                <div className="flex items-start gap-2">
                                                    <Info className="h-4 w-4 mt-0.5" />
                                                    <p>Place a ruler across the center of the ring and measure the inner diameter.</p>
                                                </div>
                                            </div>

                                            <div className="flex items-center justify-center p-8 bg-gray-50 rounded-lg">
                                                <div className="relative">
                                                    <div className="w-32 h-32 border-8 border-gray-400 rounded-full flex items-center justify-center">
                                                        <div className="w-16 h-16 bg-white rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center">
                                                            <span className="text-xs text-gray-500">Inner Diameter</span>
                                                        </div>
                                                    </div>
                                                    <div className="absolute top-1/2 left-0 right-0 h-0.5 bg-red-500 transform -translate-y-0.5">
                                                        <div className="absolute -top-2 left-0 text-xs text-red-600">0</div>
                                                        <div className="absolute -top-2 right-0 text-xs text-red-600">mm</div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <div className="space-y-2">
                                                    <label className="block text-sm font-medium">Unit</label>
                                                    <select
                                                        value={unit}
                                                        onChange={(e) => setUnit(e.target.value)}
                                                        className="select"
                                                    >
                                                        <option value="mm">Millimeters (mm)</option>
                                                        <option value="inches">Inches (in)</option>
                                                    </select>
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="block text-sm font-medium">Inner Diameter ({unit})</label>
                                                    <input
                                                        type="number"
                                                        placeholder={unit === "mm" ? "e.g., 17.3" : "e.g., 0.68"}
                                                        value={diameter}
                                                        onChange={(e) => setDiameter(e.target.value)}
                                                        step={unit === "mm" ? "0.1" : "0.01"}
                                                        className="input"
                                                    />
                                                </div>
                                                <div className="flex items-end">
                                                    <button onClick={handleDiameterCalculation} className="button button-primary w-full">
                                                        <Calculator className="h-4 w-4 mr-2" />
                                                        Calculate Size
                                                    </button>
                                                </div>
                                            </div>

                                            {calculatedSize && (
                                                <div className="p-4 bg-green-50 border border-green-200 rounded-lg">
                                                    <p className="text-center text-lg font-semibold text-green-800">
                                                        Your ring size is:{" "}
                                                        <span className="badge text-lg px-3 py-1">
                                                            {calculatedSize}
                                                        </span>
                                                    </p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'finger' && (
                                <div className="tabs-content space-y-6">
                                    <div className="card">
                                        <div className="card-header">
                                            <h2 className="card-title flex items-center gap-2">
                                                <Ruler className="h-5 w-5" />
                                                Measure Your Finger
                                            </h2>
                                            <p className="card-description">Measure the circumference of your finger</p>
                                        </div>
                                        <div className="card-content space-y-4">
                                            <div className="alert alert-info">
                                                <div className="flex items-start gap-2">
                                                    <Info className="h-4 w-4 mt-0.5" />
                                                    <p>Wrap a string or paper strip around your finger, mark where it overlaps, then measure the length.</p>
                                                </div>
                                            </div>

                                            <div className="flex items-center justify-center p-8 bg-gray-50 rounded-lg">
                                                <div className="relative">
                                                    <div className="w-20 h-32 bg-gradient-to-b from-pink-200 to-pink-300 rounded-full flex items-center justify-center relative">
                                                        <div className="absolute inset-x-0 top-8 h-1 bg-red-500 rounded">
                                                            <div className="absolute -top-6 left-0 text-xs text-red-600">String/Paper</div>
                                                        </div>
                                                        <span className="text-xs text-gray-700 mt-8">Finger</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <div className="space-y-2">
                                                    <label className="block text-sm font-medium">Unit</label>
                                                    <select
                                                        value={unit}
                                                        onChange={(e) => setUnit(e.target.value)}
                                                        className="select"
                                                    >
                                                        <option value="mm">Millimeters (mm)</option>
                                                        <option value="inches">Inches (in)</option>
                                                    </select>
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="block text-sm font-medium">Circumference ({unit})</label>
                                                    <input
                                                        type="number"
                                                        placeholder={unit === "mm" ? "e.g., 54.4" : "e.g., 2.14"}
                                                        value={circumference}
                                                        onChange={(e) => setCircumference(e.target.value)}
                                                        step={unit === "mm" ? "0.1" : "0.01"}
                                                        className="input"
                                                    />
                                                </div>
                                                <div className="flex items-end">
                                                    <button onClick={handleCircumferenceCalculation} className="button button-primary w-full">
                                                        <Calculator className="h-4 w-4 mr-2" />
                                                        Calculate Size
                                                    </button>
                                                </div>
                                            </div>

                                            {calculatedSize && (
                                                <div className="p-4 bg-green-50 border border-green-200 rounded-lg">
                                                    <p className="text-center text-lg font-semibold text-green-800">
                                                        Your ring size is:{" "}
                                                        <span className="badge text-lg px-3 py-1">
                                                            {calculatedSize}
                                                        </span>
                                                    </p>
                                                </div>
                                            )}

                                            <div className="p-4 bg-blue-50 border border-blue-200 rounded-lg">
                                                <h4 className="font-semibold text-blue-800 mb-2">Tips for accurate measurement:</h4>
                                                <ul className="text-sm text-blue-700 space-y-1">
                                                    <li>• Measure at the end of the day when fingers are largest</li>
                                                    <li>• Ensure the string/paper can slide over your knuckle</li>
                                                    <li>• Take multiple measurements and use the average</li>
                                                    <li>• Consider the width of the ring band (wider bands need larger sizes)</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'chart' && (
                                <div className="tabs-content space-y-6">
                                    <div className="card">
                                        <div className="card-header">
                                            <h2 className="card-title">US Ring Size Chart</h2>
                                            <p className="card-description">
                                                Complete reference chart with US and UK sizes and measurements in millimeters
                                            </p>
                                        </div>
                                        <div className="card-content">
                                            <div className="overflow-x-auto">
                                                <table className="w-full border-collapse border border-gray-300">
                                                    <thead>
                                                        <tr className="bg-gray-50">
                                                            <th className="border border-gray-300 px-4 py-2 text-left">US Size</th>
                                                            <th className="border border-gray-300 px-4 py-2 text-left">UK Size</th>
                                                            <th className="border border-gray-300 px-4 py-2 text-left">Inner Diameter (mm)</th>
                                                            <th className="border border-gray-300 px-4 py-2 text-left">Circumference (mm)</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {ringSizes.map((size) => (
                                                            <tr key={size.size} className="hover:bg-gray-50">
                                                                <td className="border border-gray-300 px-4 py-2 font-semibold">{size.size}</td>
                                                                <td className="border border-gray-300 px-4 py-2 font-semibold">{size.ukSize}</td>
                                                                <td className="border border-gray-300 px-4 py-2">{size.diameter}</td>
                                                                <td className="border border-gray-300 px-4 py-2">{size.circumference}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="card">
                                        <div className="card-header">
                                            <h2 className="card-title">Size Guide Tips</h2>
                                        </div>
                                        <div className="card-content">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="space-y-2">
                                                    <h4 className="font-semibold text-green-700">✓ Best Practices</h4>
                                                    <ul className="text-sm space-y-1 text-gray-600">
                                                        <li>• Measure at room temperature</li>
                                                        <li>• Measure multiple times for accuracy</li>
                                                        <li>• Consider knuckle size</li>
                                                        <li>• Account for ring width</li>
                                                        <li>• Measure at end of day</li>
                                                    </ul>
                                                </div>
                                                <div className="space-y-2">
                                                    <h4 className="font-semibold text-red-700">✗ Avoid</h4>
                                                    <ul className="text-sm space-y-1 text-gray-600">
                                                        <li>• Measuring when cold</li>
                                                        <li>• Measuring swollen fingers</li>
                                                        <li>• Using online ring sizers only</li>
                                                        <li>• Guessing based on other jewelry</li>
                                                        <li>• Measuring just once</li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<RingSizerApp />, document.getElementById('root'));
    </script>
</body>
</html>
